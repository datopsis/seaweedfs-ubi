# Standalone development stack: every role in one container.
#
# This is the local-object-store shape -- one command, one container, an S3
# endpoint on 8333. It is for development, small local use, and test fixtures.
#
# It is never a supported production posture, and the reason is not caution. In
# one process there is no network between the roles, so gRPC mTLS and volume
# JWTs protect nothing, there is no replication and therefore no durability, and
# nothing separates the S3 API from stored bytes. Use compose.yaml for anything
# resembling a deployment.
#
# No credential has a default. Create an operator-owned, ignored s3.json with
# a strong identity before starting; see docs/STANDALONE.md. Do not use the
# AWS_* environment bootstrap here: upstream logs its access-key ID at startup.
#
#   podman compose -f compose.standalone.yaml up -d
#   podman compose -f compose.standalone.yaml down
# Keep the named data volume for the next start; `down -v` deletes it.

services:
  seaweedfs:
    image: ${SEAWEEDFS_UBI_IMAGE:-localhost/seaweedfs-ubi:development}
    command: ["mini", "-dir=/data", "-ip.bind=0.0.0.0", "-s3.config=/etc/seaweedfs/s3.json"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      # Without this the entrypoint refuses to start the role at all.
      SEAWEEDFS_UBI_STANDALONE: "true"
    volumes:
      - standalone-data:/data
      - type: bind
        source: ./s3.json
        target: /etc/seaweedfs/s3.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      # Only the S3 API is published. Master, volume, filer, admin health/
      # metrics, and worker gRPC remain reachable on this development network;
      # do not attach untrusted peers or use host networking.
      - "127.0.0.1:8333:8333"
    restart: unless-stopped

volumes:
  standalone-data:
