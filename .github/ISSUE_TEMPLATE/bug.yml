name: Bug report
description: Report reproducible image, runtime, or documentation behavior
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not disclose vulnerabilities here. Use the private security link
        shown before opening an issue.
  - type: input
    id: image
    attributes:
      label: Image tag and digest
      description: Include both when available; do not report only a mutable tag.
      placeholder: ghcr.io/datopsis/seaweedfs-ubi:v4.46-ubi9-r20260912.1@sha256:...
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime, host, and versions
      placeholder: RHEL and Podman, Docker, or OpenShift versions
    validations:
      required: true
  - type: checkboxes
    id: roles
    attributes:
      label: Roles running
      description: Select every role involved in the reproduction.
      options:
        - label: master
        - label: volume
        - label: filer
        - label: s3
        - label: server (single-container profile)
    validations:
      required: true
  - type: dropdown
    id: topology
    attributes:
      label: Topology
      options:
        - Single container
        - Separated roles, single host
        - Separated roles, multiple hosts
        - Other or unknown
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - linux/amd64
        - linux/arm64
        - Other or unknown
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Minimal SeaweedFS and deployment configuration
      description: >-
        Include the role arguments, data directory mounts, and filer store
        backend. Remove S3 access keys, JWT signing keys, private keys, filer
        store credentials, tokens, internal names, and other secrets.
      render: text
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Reproduction and observed behavior
      description: List exact steps, the result, and the expected result.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets and personal or internal information.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and tested the current development revision or a supported release.
          required: true
        - label: I confirmed the behavior is not simply an upstream SeaweedFS issue reproducible on the upstream image.
          required: false
        - label: I confirmed this is not a documented deployment responsibility in SECURITY.md, such as an unauthenticated S3 gateway or an implicit temporary data directory.
          required: false
        - label: I removed secrets and sensitive data from this report.
          required: true
