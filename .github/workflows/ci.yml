name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "19 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: repository validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install hash-locked repository tooling
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --disable-pip-version-check
          --requirement .github/requirements/pre-commit.txt

      - name: Run repository checks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run deterministic Python validation tests
        run: python -m unittest discover --start-directory tests --pattern "test_*.py" --verbose

      - name: Prove artifact-lock validation fails closed
        run: bash tests/lock.sh

      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          advanced-security: false
          annotations: true
          min-severity: medium

  configuration-security:
    name: configuration security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan repository configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

  validation-result:
    name: validation
    if: ${{ always() }}
    needs:
      - validation
      - configuration-security
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        env:
          CONFIGURATION_RESULT: ${{ needs.configuration-security.result }}
          REPOSITORY_RESULT: ${{ needs.validation.result }}
        run: |
          test "${CONFIGURATION_RESULT}" = success
          test "${REPOSITORY_RESULT}" = success

  native-image:
    name: native image (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CONTAINER_RUNTIME: podman
      IMAGE: localhost/seaweedfs-ubi:ci-${{ matrix.architecture }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm native architecture and required tools
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          test "$(uname -m)" = "${EXPECTED_MACHINE}"
          for tool in podman openssl curl python3; do
            command -v "${tool}"
          done
          podman version

      - name: Validate reviewed artifact lock
        run: python3 .github/scripts/check_artifact_lock.py artifacts/seaweedfs.lock.json

      - name: Acquire verified architecture binary
        run: bash scripts/fetch-artifacts.sh ${{ matrix.architecture }}

      - name: Prove binary admission refuses bad inputs
        run: bash tests/acquisition.sh

      - name: Prove assembly refuses altered or missing inputs
        run: bash tests/assembly.sh

      - name: Pull digest-pinned base images
        run: bash scripts/fetch-base-images.sh

      - name: Assemble with offline build network and no pulling
        run: bash scripts/build-image.sh ${{ matrix.architecture }}

      - name: Confirm native image architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: >-
          test "$(podman image inspect --format '{{.Architecture}}' "${IMAGE}")"
          = "${EXPECTED_ARCHITECTURE}"

      - name: Download pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.1

      - name: Generate and validate native image SPDX SBOM
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: |
          archive="${RUNNER_TEMP}/seaweedfs-ci-${ARCHITECTURE}.tar"
          sbom="${RUNNER_TEMP}/seaweedfs-ci-${ARCHITECTURE}.spdx.json"
          podman save --format oci-archive --output "${archive}" "${IMAGE}"
          "${SYFT_CMD}" "oci-archive:${archive}" -o "spdx-json=${sbom}"
          python3 tests/lib/spdxchecks.py "${sbom}"

      - name: Retain native image SPDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-image-${{ matrix.architecture }}-spdx
          path: ${{ runner.temp }}/seaweedfs-ci-${{ matrix.architecture }}.spdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Download pinned Grype
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          grype-version: v0.118.0

      - name: Inventory native image vulnerabilities with Grype
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          GRYPE_CMD: ${{ steps.grype.outputs.cmd }}
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
        run: |
          archive="${RUNNER_TEMP}/seaweedfs-ci-${ARCHITECTURE}.tar"
          report="${RUNNER_TEMP}/seaweedfs-ci-${ARCHITECTURE}.grype.json"
          "${GRYPE_CMD}" "oci-archive:${archive}" --output json --file "${report}"
          python3 -c 'import json,sys; report=json.load(open(sys.argv[1], encoding="utf-8")); assert isinstance(report.get("matches"), list) and report.get("descriptor", {}).get("name") == "grype"' "${report}"

      - name: Retain native image Grype vulnerability inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-image-${{ matrix.architecture }}-grype
          path: ${{ runner.temp }}/seaweedfs-ci-${{ matrix.architecture }}.grype.json
          if-no-files-found: error
          retention-days: 14

      - name: Qualify restricted standalone runtime
        run: bash tests/smoke.sh

      - name: Qualify separated-role topology and readiness
        run: bash tests/cluster.sh

      - name: Qualify authenticated S3 and multipart
        run: bash tests/s3.sh

      - name: Qualify client-facing TLS
        run: bash tests/s3-tls.sh

      - name: Qualify inter-component security
        run: bash tests/inter-component.sh

      - name: Qualify observability listeners
        run: bash tests/observability.sh

      - name: Qualify state survival
        run: bash tests/state-survival.sh

      - name: Qualify one-host replicated-volume behavior
        run: bash tests/replication.sh

      - name: Qualify bounded storage exhaustion
        run: bash tests/resource-exhaustion.sh

      - name: Qualify cold backup and restore
        run: bash tests/backup-restore.sh

  native-image-result:
    name: native image
    if: ${{ always() }}
    needs: native-image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both native architecture jobs
        env:
          MATRIX_RESULT: ${{ needs.native-image.result }}
        run: test "${MATRIX_RESULT}" = success
